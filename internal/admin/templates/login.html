{{define "title"}}Sign in{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Paste the admin token set in the gateway's environment.</p>
  {{with .Error}}<p class="alert error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <label><span>Admin token</span>
      <input type="password" name="token" autocomplete="off" required autofocus spellcheck="false">
    </label>
    <button class="primary">Sign in</button>
  </form>
</section>
{{end}}
