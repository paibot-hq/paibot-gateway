# Paibot Gateway with PostgreSQL, for trying it out on one machine. Requests go
# to Ollama running on this machine (ollama pull qwen3:0.6b); edit
# paibot-gateway.json to use another upstream. The database password is fixed
# and nothing listens beyond localhost; do not run it like this in
# production.
#
#   echo "PAIBOT_GATEWAY_ADMIN_TOKEN=$(openssl rand -hex 32)" > .env
#   docker compose up -d --build
#
# Then sign in at http://127.0.0.1:8081 with that token.
name: paibot-gateway-quickstart

x-database-url: &database-url postgres://paibot_gateway:paibot_gateway@postgres:5432/paibot_gateway?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: paibot_gateway
      POSTGRES_PASSWORD: paibot_gateway
      POSTGRES_DB: paibot_gateway
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paibot_gateway"]
      interval: 2s
      retries: 30

  # The paibot-gateway command line. On "up" it creates the tables and exits; use
  # it for other commands with: docker compose run --rm cli key list
  cli:
    build: ../..
    image: paibot-gateway:quickstart
    entrypoint: ["/paibot-gateway"]
    command: ["db", "migrate"]
    working_dir: /etc/paibot-gateway
    environment:
      PAIBOT_GATEWAY_DATABASE_URL: *database-url
    volumes: ["./paibot-gateway.json:/etc/paibot-gateway/paibot-gateway.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  paibot-gateway:
    image: paibot-gateway:quickstart
    environment:
      PAIBOT_GATEWAY_DATABASE_URL: *database-url
      PAIBOT_GATEWAY_ADMIN_TOKEN: ${PAIBOT_GATEWAY_ADMIN_TOKEN:?put PAIBOT_GATEWAY_ADMIN_TOKEN in .env first; see the top of compose.yaml}
    volumes: ["./paibot-gateway.json:/etc/paibot-gateway/paibot-gateway.json:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"] # Ollama on this machine
    ports:
      - "127.0.0.1:8080:8080" # the gateway
      - "127.0.0.1:8081:8081" # the admin UI
    depends_on:
      cli: { condition: service_completed_successfully }

volumes:
  pgdata:
